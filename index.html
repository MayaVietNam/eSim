<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ez Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--pri:#145e9b;--acc:#de2137;--ink:#1b1e22;--mut:#586374;--line:#d8dfe9;--bg:#f5f7fa;--ok:#326426;--okbg:#f3f7f2;--err:#ca1e32;--errbg:#fce9eb;--grad:linear-gradient(135deg,#1C8CE0,#145E9B)}
*{box-sizing:border-box}
body{margin:0;font-family:'Source Sans 3','Hiragino Sans','Noto Sans JP','Noto Sans',sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
button{font:inherit;cursor:pointer}
h1,h2,.ttl{font-family:'Outfit','Source Sans 3',sans-serif}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 16px;background:linear-gradient(150deg,#032d5c 0,#145e9b 55%,#1c8ce0 100%)}
.lcard{width:100%;max-width:400px;background:#fff;border-radius:28px;padding:32px 28px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 32px rgba(27,30,34,.2)}
.lcard img{height:76px;width:auto;align-self:flex-start}
.lcard h1{margin:0;font-size:20px}
.sub{color:var(--mut);font-size:14px;margin:0}
.note{font-size:12px;color:var(--mut);line-height:1.5}
#gbtn{display:flex;justify-content:center;min-height:44px}
.err{color:var(--err);font-size:13px}
.seg{display:inline-flex;border:1.5px solid #b3bfd1;border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;color:var(--ink);padding:8px 14px;font-size:13px;font-weight:700;min-height:36px}
.seg button.on{background:var(--pri);color:#fff}
/* app */
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#032d5c 0,#0a4f9e 100%);padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
aside .logo{height:60px;width:auto;align-self:flex-start}
aside nav{display:flex;flex-direction:column;gap:4px}
.nb{display:flex;align-items:center;justify-content:space-between;gap:8px;height:48px;padding:0 16px;border:0;border-radius:14px;background:transparent;color:#d6e6f7;font-size:15px;font-weight:600;text-align:left}
.nb.on{background:#fff;color:var(--pri);box-shadow:inset 3px 0 0 var(--pri)}
.badge{min-width:22px;padding:2px 8px;border-radius:999px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.side-foot .who{font-size:12px;color:rgba(255,255,255,.8);overflow-wrap:anywhere;text-align:center}
.side-foot .seg{align-self:center}
.lo{height:44px;border-radius:999px;border:1.5px solid #b3bfd1;background:#fff;color:#404854;font-weight:600;padding:0 16px}
.mhead{display:none}
main{padding:32px 40px;min-width:0}
.top h1{margin:0 0 4px;font-size:26px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 1px 2px rgba(27,30,34,.06)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.sec{display:flex;align-items:center;gap:10px;font-family:'Outfit',sans-serif;font-weight:600;font-size:17px;margin:4px 0 12px}
.sec i{width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;font-style:normal;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-size:13px;font-weight:600;color:#404854}
.f input,.f textarea{height:48px;padding:0 14px;border:1.5px solid #b3bfd1;border-radius:14px;font:inherit;background:#fff;color:var(--ink);width:100%}
.f textarea{height:84px;padding:12px 14px;resize:vertical}
.f input.bad,.f textarea.bad{border-color:var(--acc)}
.f .hint{font-size:12px;color:var(--mut)}
.f .e{font-size:12px;color:var(--err)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.chs button{height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #b3bfd1;background:#fff;font-weight:600;color:#404854}
.chs button.on{border-color:var(--pri);background:#eaf4fe;color:var(--pri)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.b{height:48px;padding:0 20px;border-radius:999px;border:1.5px solid #b3bfd1;background:#fff;color:#404854;font-weight:700}
.b.p{border:0;background:var(--grad);color:#fff}
.b.p:disabled{background:#8d9db4;cursor:not-allowed}
.b.d{border-color:var(--acc);color:var(--err)}
.b.s{height:40px;padding:0 14px;font-size:13px}
.qr{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qrbox{width:200px;height:200px;border:1.5px dashed #b3bfd1;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;padding:12px;background:#fff}
.qrbox canvas{width:100%;height:100%;image-rendering:pixelated}
.toast{margin-top:16px;padding:12px 16px;border-radius:14px;font-weight:600}
.toast.ok{background:var(--okbg);color:var(--ok)}.toast.er{background:var(--errbg);color:var(--err)}.toast.wn{background:#fff6e0;color:#8a5a00}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.tools input[type=search]{height:44px;border:1.5px solid #b3bfd1;border-radius:999px;padding:0 16px;min-width:340px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#eaf4fe;color:var(--pri);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#f5f9fe;text-align:left;color:#404854;font-size:12px;padding:10px 8px;font-weight:600}
td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:#f8fbff}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:#fff}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st.sent{background:var(--okbg);color:var(--ok)}.st.failed{background:var(--errbg);color:var(--err)}.st.dup{background:#fff6e0;color:#8a5a00}.st.sending{background:#eaf4fe;color:var(--pri)}.st.wait{background:#f5f7fa;color:#404854}
.sm{font-size:12px;color:var(--mut);overflow-wrap:anywhere}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri)}
.confirm{margin-top:12px;padding:14px 16px;border-radius:14px;background:#fff6e0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-weight:600}
.empty{padding:40px;text-align:center;color:var(--mut)}
@media(max-width:900px){
 #app{display:block;padding-bottom:76px}
 aside{position:fixed;left:0;right:0;bottom:0;top:auto;height:64px;padding:0;flex-direction:row;gap:0;z-index:20;box-shadow:0 -2px 12px rgba(0,0,0,.15)}
 aside .logo,aside .side-foot{display:none}
 aside nav{flex-direction:row;width:100%;gap:0}
 .nb{flex:1;flex-direction:column;justify-content:center;height:64px;border-radius:0;padding:0 4px;gap:2px;font-size:12px;text-align:center}
 .nb.on{box-shadow:inset 0 3px 0 var(--pri)}
 .mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
 .mhead img{height:36px;width:auto}
 .mhead .r{display:flex;gap:8px;align-items:center}
 .mhead .lo{height:36px;padding:0 12px;font-size:12px}
 .mhead .seg button{padding:6px 10px;min-height:32px;font-size:12px}
 main{padding:16px}
 .top h1{font-size:22px}
 .cols{grid-template-columns:1fr}
 .grid2{grid-template-columns:1fr}
 .card{padding:18px;border-radius:18px}
 .tools input[type=search]{min-width:0;flex:1 1 100%}
 .tools .b{flex:1}
 .tw{border:0;background:transparent}
 table,thead,tbody,tr,td{display:block}
 thead{display:none}
 tr{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
 td{border:0;padding:3px 0}
 tr:hover td{background:transparent}
}
</style>
</head>

function api(body){
  if(!CONFIG.API_URL||CONFIG.API_URL.indexOf('http')!==0)return Promise.reject(new Error('SETUP'));
  body.id_token=S.token;
  return fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
   .then(function(r){return r.text();},function(){throw new Error('FETCH');})
   .then(function(t){try{return JSON.parse(t);}catch(x){throw new Error('FETCH');}})
   .then(function(j){
     if(j.status==='error'&&/AUTH_(REQUIRED|INVALID|EXPIRED)/.test(j.message||''))throw new Error('AUTH');
     if(j.status==='error'&&/NOT_ALLOWED/.test(j.message||''))throw new Error('NOT');
     return j;});
}
function errText(e){var m=(e&&e.message)||'';if(m==='AUTH')return T('eAUTH');if(m==='NOT')return T('eNOT');if(m==='SETUP')return T('eSETUP');if(m.indexOf('SRV:')===0)return T('eSRV')+m.slice(4);if(m==='FETCH')return T('eFETCH');return T('eNET');}

// ============ ログイン ============
function jwtExp(t){try{var p=JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));return p.exp*1000;}catch(e){return 0;}}
function onCredential(resp){
  S.token=resp.credential;
  api({action:'whoami'}).then(function(j){
    if(j.status!=='success')throw new Error('SRV:'+(j.message||''));
    S.user=j.user;store('ez_tok',S.token);showApp();
  }).catch(function(e){S.token='';store('ez_tok',null);showLogin(errText(e));});
}
function initGoogle(){
  if(!(window.google&&google.accounts&&google.accounts.id)){setTimeout(initGoogle,300);return;}
  google.accounts.id.initialize({client_id:CONFIG.CLIENT_ID,callback:onCredential,auto_select:false});
  $('#gbtn').innerHTML='';
  google.accounts.id.renderButton($('#gbtn'),{theme:'outline',size:'large',shape:'pill',text:'signin_with',width:300,locale:S.lang});
}
function showLogin(msg){
  $('#app').classList.add('hide');$('#login').classList.remove('hide');
  var e=$('#lerr');if(msg){e.textContent=msg;e.classList.remove('hide');}else e.classList.add('hide');
  initGoogle();
}
function logout(){
  try{google.accounts.id.disableAutoSelect();}catch(e){}
  S.token='';S.user=null;store('ez_tok',null);S.queue=[];S.sel={};S.history=[];showLogin();
}
function showApp(){
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  $$('[data-who]').forEach(function(x){x.textContent=(S.user&&S.user.email)||'';});
  go(S.view);
}

// ============ 画面共通 ============
function applyLang(){
  document.documentElement.lang=S.lang;
  $$('[data-t]').forEach(function(x){x.textContent=T(x.getAttribute('data-t'));});
  $$('[data-langseg]').forEach(function(seg){
    seg.innerHTML=LANGS.map(function(l){return '<button type="button" data-lang="'+l[0]+'" class="'+(S.lang===l[0]?'on':'')+'">'+l[1]+'</button>';}).join('');
  });
  $('#qSearch').placeholder=T('search');$('#hSearch').placeholder=T('search');
  renderChannels();renderMailLangs();renderViewHead();updateForm();renderQueue();renderHistory();
  if(!$('#login').classList.contains('hide'))initGoogle();
}
function renderViewHead(){
  var m={compose:['tCompose','sCompose'],queue:['tQueue','sQueue'],history:['tHistory','sHistory']}[S.view];
  $('#vTitle').textContent=T(m[0]);$('#vSub').textContent=T(m[1]);
}
function go(v){
  if(S.view!==v)toast('','');
  S.view=v;
  ['compose','queue','history'].forEach(function(x){$('#v-'+x).classList.toggle('hide',x!==v);});
  $$('.nb').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-view')===v);});
  renderViewHead();
  if(v==='history')loadHistory();
  if(v==='queue')renderQueue();
  window.scrollTo(0,0);
}
function toast(kind,msg){var t=$('#toast');t.innerHTML=msg?'<div class="toast '+kind+'" role="status">'+esc(msg)+'</div>':'';if(msg&&kind==='ok')setTimeout(function(){if(t.textContent===msg)t.innerHTML='';},4000);}

// ============ 作成フォーム ============
function renderChannels(){
  $('#chs').innerHTML=CHANNELS.map(function(c){return '<button type="button" data-ch="'+esc(c)+'" class="'+(S.form.channel===c?'on':'')+'">'+esc(c)+'</button>';}).join('');
}
function renderMailLangs(){
  $('#mls').innerHTML=['ja','en','vi'].map(function(l){return '<button type="button" data-ml="'+l+'" class="'+(S.form.mailLang===l?'on':'')+'">'+MAILLANG[l]+'</button>';}).join('');
}
function validate(f){
  var e={};
  if(!f.name.trim())e.name=T('errName');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim()))e.email=T('errEmail');
  if(!f.order.trim())e.order=T('errOrder');
  if(!/^\d{19,20}$/.test(f.iccid.trim()))e.iccid=T('errIccid');
  if(!f.plan.trim())e.plan=T('errPlan');
  if(!/^LPA:1\$.+/i.test(f.lpa.trim()))e.lpa=T('errLpa');
  return e;
}
function updateForm(){
  var f=S.form,E=S.touched?validate(f):{};
  [['name','fName','eName'],['email','fEmail','eEmail'],['order','fOrder','eOrder'],['iccid','fIccid','eIccid'],['plan','fPlan','ePlan'],['lpa','fLpa','eLpa']].forEach(function(a){
    var inp=$('#'+a[1]);if(inp.value!==f[a[0]])inp.value=f[a[0]];
    inp.classList.toggle('bad',!!E[a[0]]);
    var er=$('#'+a[2]);er.textContent=E[a[0]]||'';er.classList.toggle('hide',!E[a[0]]);
  });
  drawQr();
}
function qrCanvas(lpa,px){
  var q=qrcode(0,'M');q.addData(lpa);q.make();
  var n=q.getModuleCount(),m=4,sc=Math.max(2,Math.floor(px/(n+m*2))),size=(n+m*2)*sc;
  var c=document.createElement('canvas');c.width=c.height=size;
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);x.fillStyle='#000';
  for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*sc,(r+m)*sc,sc,sc);
  return c;
}
function qrDataUrl(lpa){return qrCanvas(lpa,400).toDataURL('image/jpeg',0.92);}
function drawQr(){
  var box=$('#qrBox'),note=$('#qrNote'),l=S.form.lpa.trim();
  box.innerHTML='';
  if(!l){box.textContent=T('qrEmpty');note.textContent='';return;}
  if(!/^LPA:1\$.+/i.test(l)){box.textContent=T('qrNg');note.textContent='';return;}
  try{box.appendChild(qrCanvas(l,360));note.textContent=T('qrOk');}catch(e){box.textContent=T('qrNg');}
}
function bindForm(){
  [['name','fName'],['email','fEmail'],['order','fOrder'],['iccid','fIccid'],['plan','fPlan'],['lpa','fLpa']].forEach(function(a){
    $('#'+a[1]).addEventListener('input',function(e){
      var v=e.target.value;
      if(a[0]==='iccid')v=v.replace(/\s|-/g,'');
      if(a[0]==='lpa')v=v.replace(/\s+/g,'');
      S.form[a[0]]=v;updateForm();});
  });
  $('#chs').addEventListener('click',function(e){var b=e.target.closest('[data-ch]');if(b){S.form.channel=b.getAttribute('data-ch');renderChannels();}});
  $('#mls').addEventListener('click',function(e){var b=e.target.closest('[data-ml]');if(b){S.form.mailLang=b.getAttribute('data-ml');renderMailLangs();}});
  $('#bClear').addEventListener('click',function(){S.form=blank();S.touched=false;renderChannels();renderMailLangs();updateForm();toast('','');});
  $('#bAdd').addEventListener('click',function(){
    S.touched=true;var E=validate(S.form);updateForm();if(Object.keys(E).length)return;
    var it=Object.assign({id:uid(),status:'wait',msg:''},S.form);
    S.queue.unshift(it);S.sel[it.id]=true;S.form=blank();S.touched=false;
    renderChannels();renderMailLangs();updateForm();renderQueue();toast('ok',T('added'));
  });
  $('#bTest').addEventListener('click',function(){
    S.touched=true;var E=validate(S.form);updateForm();if(Object.keys(E).length)return;
    var it=Object.assign({},S.form,{email:S.user.email,channel:'TEST'});
    toast('wn',T('testing'));
    sendItem(it,true).then(function(r){
      if(r.ok)toast('ok',T('tested'));else toast('er',r.msg);
    });
  });
}

// ============ 送信 ============
function payload(it,force){
  var lpa=it.lpa.trim();
  return{
    customer_name:it.name.trim(),customer_email:it.email.trim(),email_language:it.mailLang,
    order_source_type:it.channel,force:!!force,
    esims:[{order_number:it.order.trim(),package_name:it.plan.trim(),iccid:it.iccid.trim(),
      android_lpa:lpa,ios_link:'https://esimsetup.apple.com/esim_qrcode_provisioning?carddata='+lpa,
      qr_code_image:qrDataUrl(lpa)}]
  };
}
// 戻り値 {ok, dup, msg, authFail}
function sendItem(it,force){
  var body=payload(it,force);body.action='send';
  return api(body).then(function(j){
    if(j.status==='success'){return{ok:true,warn:j.log_failed?T('eLOG'):''};}
    if(j.status==='duplicate')return{ok:false,dup:{by:j.sent_by,at:j.sent_at},msg:T('dupMsg',{by:j.sent_by,at:j.sent_at})};
    if(j.code==='QUOTA')return{ok:false,msg:T('eQUOTA')};
    return{ok:false,msg:String(j.message||T('eNET'))};
  }).catch(function(e){
    if(e.message==='AUTH'||e.message==='NOT'){return{ok:false,authFail:errText(e),msg:errText(e)};}
    return{ok:false,msg:errText(e)};
  });
}
function sendSelected(){
  var items=S.queue.filter(function(q){return S.sel[q.id]&&q.status!=='sent'&&q.status!=='sending';});
  if(!items.length||S.sending)return;
  S.sending=true;S.confirming=false;var ok=0,ng=0,i=0,warn='';
  items.forEach(function(q){q.status='sending';q.msg='';q.dup=null;});renderQueue();
  (function next(){
    if(i>=items.length){
      S.sending=false;S.queue=S.queue.filter(function(q){return q.status!=='sent';});renderQueue();
      toast(ng?'wn':'ok',(ng?T('partial',{ok:ok,ng:ng}):T('doneN',{n:ok}))+(warn?' '+warn:''));return;}
    var q=items[i++];
    sendItem(q,false).then(function(r){
      if(r.authFail){S.sending=false;q.status='failed';q.msg=r.msg;renderQueue();showLogin(r.authFail);return;}
      if(r.ok){q.status='sent';ok++;if(r.warn)warn=r.warn;}
      else if(r.dup){q.status='dup';q.dup=r.dup;q.msg=r.msg;ng++;}
      else{q.status='failed';q.msg=r.msg;ng++;}
      renderQueue();next();});
  })();
}
function resendOne(id){
  var q=S.queue.filter(function(x){return x.id===id;})[0];if(!q||S.sending)return;
  q.status='sending';renderQueue();
  sendItem(q,true).then(function(r){
    if(r.authFail){q.status='failed';renderQueue();showLogin(r.authFail);return;}
    if(r.ok){S.queue=S.queue.filter(function(x){return x.id!==id;});toast('ok',T('doneN',{n:1}));}
    else{q.status='failed';q.msg=r.msg;}
    renderQueue();});
}

// ============ キュー ============
function stLabel(s){return{wait:T('stWait'),sending:T('stSending'),sent:T('stSent'),failed:T('stFailed'),dup:T('stDup')}[s];}
function hit(o,q){q=q.trim().toLowerCase();if(!q)return true;return o.map(function(x){return String(x||'').toLowerCase();}).join(' ').indexOf(q)!==-1;}
function renderQueue(){
  var vis=S.queue.filter(function(q){return hit([q.name,q.email,q.order],S.qSearch);});
  var n=S.queue.filter(function(q){return S.sel[q.id];}).length;
  $('#qBadge').textContent=S.queue.length;
  var counts={};S.queue.forEach(function(q){counts[q.channel]=(counts[q.channel]||0)+1;});
  $('#chips').innerHTML=Object.keys(counts).map(function(c){return '<span class="chip">'+esc(c)+' '+counts[c]+'</span>';}).join('');
  var allSel=vis.length&&vis.every(function(q){return S.sel[q.id];});
  $('#bAll').textContent=allSel?T('none'):T('all');
  var b=$('#bSend');b.textContent=T('sendSel',{n:n});b.disabled=!n||S.sending;
  var c=$('#confirm');
  if(S.confirming&&n){c.classList.remove('hide');c.innerHTML='<span>'+esc(T('confirmMsg',{n:n}))+'</span><button class="b p s" id="cYes">'+esc(T('yes'))+'</button><button class="b s" id="cNo">'+esc(T('cancel'))+'</button>';}
  else{c.classList.add('hide');c.innerHTML='';}
  if(!vis.length){$('#qList').innerHTML='<div class="card empty">'+esc(T('qEmpty'))+'</div>';return;}
  $('#qList').innerHTML='<div class="tw"><table><thead><tr><th></th><th>'+T('thOrder')+'</th><th>'+T('thCustomer')+'</th><th>'+T('thChannel')+'</th><th>'+T('mailLang')+'</th><th>'+T('thPlan')+'</th><th>'+T('thStatus')+'</th><th></th></tr></thead><tbody>'+
   vis.map(function(q){
    var act='';
    if(q.status==='dup')act='<button class="b s d" data-resend="'+q.id+'">'+esc(T('resend'))+'</button>';
    else if(q.status==='failed')act='<button class="b s d" data-resend="'+q.id+'">'+esc(T('retry'))+'</button>';
    if(q.status!=='sending')act+=' <button class="b s" data-rm="'+q.id+'">'+esc(T('remove'))+'</button>';
    return '<tr><td><input type="checkbox" data-sel="'+q.id+'" '+(S.sel[q.id]?'checked':'')+' '+(q.status==='sending'?'disabled':'')+' aria-label="select"></td>'+
     '<td><b style="color:var(--pri)">'+esc(q.order)+'</b></td>'+
     '<td><div style="font-weight:600">'+esc(q.name)+'</div><div class="sm">'+esc(q.email)+'</div></td>'+
     '<td><span class="chip">'+esc(q.channel)+'</span></td><td>'+esc(MAILLANG[q.mailLang])+'</td><td>'+esc(q.plan)+'</td>'+
     '<td><span class="st '+q.status+'">'+esc(stLabel(q.status))+'</span>'+(q.msg?'<div class="sm" style="color:var(--err);margin-top:4px">'+esc(q.msg)+'</div>':'')+'</td>'+
     '<td style="white-space:nowrap">'+act+'</td></tr>';}).join('')+'</tbody></table></div>';
}
function bindQueue(){
  $('#qSearch').addEventListener('input',function(e){S.qSearch=e.target.value;renderQueue();});
  $('#bAll').addEventListener('click',function(){
    var vis=S.queue.filter(function(q){return hit([q.name,q.email,q.order],S.qSearch);});
    var allSel=vis.length&&vis.every(function(q){return S.sel[q.id];});
    vis.forEach(function(q){S.sel[q.id]=!allSel;});renderQueue();});
  $('#bSend').addEventListener('click',function(){S.confirming=true;renderQueue();});
  $('#confirm').addEventListener('click',function(e){
    if(e.target.id==='cYes')sendSelected();
    if(e.target.id==='cNo'){S.confirming=false;renderQueue();}});
  $('#qList').addEventListener('change',function(e){var id=e.target.getAttribute('data-sel');if(id){S.sel[id]=e.target.checked;S.confirming=false;renderQueue();}});
  $('#qList').addEventListener('click',function(e){
    var r=e.target.closest('[data-rm]');if(r){var id=r.getAttribute('data-rm');S.queue=S.queue.filter(function(q){return q.id!==id;});delete S.sel[id];renderQueue();return;}
    var s=e.target.closest('[data-resend]');if(s)resendOne(s.getAttribute('data-resend'));});
}

// ============ 履歴 ============
function loadHistory(){
  $('#hList').innerHTML='<div class="card empty">…</div>';
  api({action:'history'}).then(function(j){
    if(j.status!=='success')throw new Error('SRV:'+(j.message||''));
    S.history=j.data||[];renderHistory();
  }).catch(function(e){
    if(e.message==='AUTH'||e.message==='NOT'){showLogin(errText(e));return;}
    $('#hList').innerHTML='<div class="card empty" style="color:var(--err)">'+esc(errText(e))+'</div>';});
}
function renderHistory(){
  var rows=S.history.filter(function(h){return hit([h.customer_name,h.email,h.order_number,h.sent_by],S.hSearch);});
  if(!rows.length){$('#hList').innerHTML='<div class="card empty">'+esc(T('hEmpty'))+'</div>';return;}
  $('#hList').innerHTML='<div class="tw"><table><thead><tr><th>'+T('thTime')+'</th><th>'+T('thOrder')+'</th><th>'+T('thCustomer')+'</th><th>'+T('thChannel')+'</th><th>'+T('thPlan')+'</th><th>'+T('thSender')+'</th></tr></thead><tbody>'+
   rows.map(function(h){return '<tr><td style="white-space:nowrap">'+esc(h.time)+'</td><td><b style="color:var(--pri)">'+esc(h.order_number)+'</b></td>'+
    '<td><div style="font-weight:600">'+esc(h.customer_name)+'</div><div class="sm">'+esc(h.email)+'</div></td>'+
    '<td><span class="chip">'+esc(h.source)+'</span></td><td>'+esc(h.package_name)+'</td><td class="sm">'+esc(h.sent_by)+'</td></tr>';}).join('')+'</tbody></table></div>';
}

// ============ 起動 ============
document.addEventListener('click',function(e){
  var l=e.target.closest('[data-lang]');if(l){S.lang=l.getAttribute('data-lang');try{localStorage.setItem('ez_lang',S.lang);}catch(x){}applyLang();return;}
  var n=e.target.closest('.nb');if(n){go(n.getAttribute('data-view'));return;}
  if(e.target.closest('[data-logout]'))logout();
});
$('#hSearch').addEventListener('input',function(e){S.hSearch=e.target.value;renderHistory();});
$('#bReload').addEventListener('click',loadHistory);
bindForm();bindQueue();
try{var sl=localStorage.getItem('ez_lang');if(DICT[sl])S.lang=sl;}catch(e){}
applyLang();
var saved=store('ez_tok');
if(saved&&jwtExp(saved)>Date.now()+60000){
  S.token=saved;
  api({action:'whoami'}).then(function(j){if(j.status==='success'){S.user=j.user;showApp();}else throw new Error('NET');})
   .catch(function(){store('ez_tok',null);S.token='';showLogin();});
}else{store('ez_tok',null);showLogin();}
</script>
